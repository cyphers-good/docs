# GitHub Pages 배포 워크플로 (GitHub Actions 방식)
# main에 푸시되면 자동으로 빌드·배포된다.
name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 배포용

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Pages가 https://<org>.github.io/<repo>/ 하위 경로로 서빙되므로 repo 이름을 basePath로 주입.
          # 커스텀 도메인을 연결하면 이 줄을 삭제할 것.
          NEXT_PUBLIC_BASE_PATH: /docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
